# This file is written for reading, it is not loaded or run in any test
# in this project. It shows the shape of a real Prometheus scrape
# config and alert rules, pointed at the /metrics/prometheus endpoint
# metrics_endpoint.py builds in this folder.

global:
  scrape_interval: 15s   # how often Prometheus pulls metrics from each target
  evaluation_interval: 15s   # how often alert rules below are checked

scrape_configs:
  - job_name: "rag-service"
    static_configs:
      - targets: ["localhost:8000"]
    metrics_path: /metrics/prometheus

